name: Mobile E2E CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-config-check:
    name: ESLint & WDIO Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (WDIO rules & JS checks)
        run: npm run lint

      - name: Verify WDIO ESM configurations
        run: |
          node -e "
            (async () => {
              for (const c of ['wdio.shared.conf.js', 'wdio.android.conf.js', 'wdio.ios.conf.js', 'wdio.android.bs.conf.js']) {
                const mod = await import('./config/' + c);
                if (!mod.config) throw new Error('Missing config export in ' + c);
                console.log('Validated config:', c);
              }
            })();
          "

  browserstack-android-e2e:
    name: BrowserStack Android E2E
    needs: lint-and-config-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Android Add Note suite on BrowserStack
        env:
          BROWSERSTACK_USER: ${{ secrets.BS_USER }}
          BROWSERSTACK_KEY: ${{ secrets.BS_KEY }}
        run: npx wdio config/wdio.android.bs.conf.js --spec test/specs/android/add-note-screen.spec.js

      - name: Upload Allure results & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-artifacts
          path: |
            allure-results/
            logs/
          if-no-files-found: ignore
          retention-days: 14
